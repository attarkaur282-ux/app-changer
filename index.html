<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>App Changer - SATVIR AURA</title>
    <link rel="manifest" href="manifest.json">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0a2a, #1a0000);
            min-height: 100vh;
            color: white;
            padding: 16px;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            padding: 20px 0;
        }
        .header h1 {
            font-size: 24px;
            color: #ff4444;
            text-shadow: 0 0 10px rgba(255,0,0,0.3);
        }
        .header p {
            font-size: 12px;
            color: #ff6666;
            opacity: 0.7;
        }
        .card {
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(12px);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
            border: 1px solid rgba(255,68,68,0.2);
        }
        .card h3 {
            color: #ff6666;
            margin-bottom: 12px;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        input, select {
            width: 100%;
            padding: 12px;
            margin-bottom: 10px;
            border: none;
            border-radius: 10px;
            background: rgba(0,0,0,0.5);
            color: white;
            font-size: 14px;
            border: 1px solid rgba(255,68,68,0.2);
        }
        input::placeholder {
            color: rgba(255,255,255,0.3);
        }
        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #ff4444, #cc0000);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }
        button:active {
            transform: scale(0.97);
        }
        .app-list {
            margin-top: 12px;
        }
        .app-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(0,0,0,0.3);
            border-radius: 12px;
            padding: 10px 14px;
            margin-bottom: 8px;
            border: 1px solid rgba(255,68,68,0.1);
            cursor: pointer;
            transition: background 0.2s;
        }
        .app-item:active {
            background: rgba(255,68,68,0.2);
        }
        .app-item-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .app-item-left img {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            object-fit: cover;
            background: #222;
        }
        .app-item-left .placeholder-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            background: linear-gradient(135deg, #ff4444, #880000);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: bold;
            color: white;
        }
        .app-item-left .name {
            font-size: 14px;
            font-weight: 500;
        }
        .app-item .edit-btn {
            background: rgba(255,68,68,0.2);
            border: none;
            color: #ff6666;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 11px;
            cursor: pointer;
            width: auto;
        }
        .app-item .edit-btn:active {
            background: rgba(255,68,68,0.4);
        }
        .empty-state {
            text-align: center;
            padding: 30px 0;
            color: rgba(255,255,255,0.3);
            font-size: 13px;
        }
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.9);
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 13px;
            color: white;
            border: 1px solid #ff4444;
            display: none;
            z-index: 999;
        }
        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(10px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal {
            background: linear-gradient(135deg, #1a1a2e, #2a0a0a);
            border-radius: 20px;
            padding: 24px;
            max-width: 400px;
            width: 100%;
            border: 1px solid rgba(255,68,68,0.3);
        }
        .modal h3 {
            color: #ff6666;
            margin-bottom: 16px;
            text-align: center;
        }
        .modal .icon-preview {
            display: flex;
            justify-content: center;
            margin-bottom: 16px;
        }
        .modal .icon-preview img {
            width: 80px;
            height: 80px;
            border-radius: 20px;
            object-fit: cover;
            background: #222;
            border: 2px solid #ff4444;
        }
        .modal .icon-preview .placeholder-icon {
            width: 80px;
            height: 80px;
            border-radius: 20px;
            background: linear-gradient(135deg, #ff4444, #880000);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: bold;
            color: white;
            border: 2px solid #ff4444;
        }
        .modal .row {
            display: flex;
            gap: 8px;
        }
        .modal .row button {
            flex: 1;
            padding: 10px;
            font-size: 12px;
        }
        .modal .btn-secondary {
            background: rgba(255,255,255,0.1);
        }
        .modal .btn-danger {
            background: #880000;
        }
        .modal input[type="file"] {
            display: none;
        }
        .modal .file-label {
            background: rgba(255,68,68,0.2);
            border: 1px dashed #ff4444;
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
            color: #ff6666;
            font-size: 12px;
            margin-bottom: 10px;
        }
        @media (max-width: 400px) {
            .header h1 { font-size: 20px; }
            .app-item { padding: 8px 10px; }
            .app-item-left img { width: 32px; height: 32px; }
            .app-item-left .placeholder-icon { width: 32px; height: 32px; font-size: 14px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>🔧 APP CHANGER</h1>
            <p>by @notxsatvir | Change app name & icon</p>
        </div>

        <!-- Add App Card -->
        <div class="card">
            <h3>➕ ADD NEW APP</h3>
            <input type="text" id="appNameInput" placeholder="Enter app name">
            <div class="row" style="display:flex; gap:8px;">
                <input type="text" id="appIconUrlInput" placeholder="Icon URL (optional)" style="flex:1;">
                <button id="addAppBtn" style="width:auto; padding:12px 20px;">Add</button>
            </div>
        </div>

        <!-- App List -->
        <div class="card">
            <h3>📱 MY APPS</h3>
            <div id="appList" class="app-list">
                <div class="empty-state">No apps added yet.<br>Add your first app above!</div>
            </div>
        </div>
    </div>

    <!-- Edit Modal -->
    <div id="editModal" class="modal-overlay">
        <div class="modal">
            <h3>✏️ EDIT APP</h3>
            <div class="icon-preview" id="iconPreview">
                <div class="placeholder-icon">A</div>
            </div>
            <input type="text" id="editNameInput" placeholder="New app name">
            <div class="file-label" id="fileLabel">📁 Choose Icon (PNG/JPG)</div>
            <input type="file" id="iconFileInput" accept="image/*">
            <input type="text" id="editIconUrlInput" placeholder="Or paste icon URL">
            <div class="row" style="margin-top:12px;">
                <button id="saveEditBtn">💾 Save</button>
                <button class="btn-secondary" id="cancelEditBtn">Cancel</button>
            </div>
            <button class="btn-danger" id="deleteAppBtn" style="margin-top:8px;">🗑️ Delete App</button>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script>
        // ========== DATA ==========
        let apps = JSON.parse(localStorage.getItem('satvir_apps') || '[]');
        let editingIndex = -1;

        // ========== HELPERS ==========
        function saveApps() {
            localStorage.setItem('satvir_apps', JSON.stringify(apps));
            renderApps();
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 2500);
        }

        function getInitials(name) {
            return name.charAt(0).toUpperCase();
        }

        // ========== RENDER ==========
        function renderApps() {
            const container = document.getElementById('appList');
            if (apps.length === 0) {
                container.innerHTML = '<div class="empty-state">No apps added yet.<br>Add your first app above!</div>';
                return;
            }
            let html = '';
            apps.forEach((app, index) => {
                const iconHtml = app.icon ? 
                    `<img src="${app.icon}" alt="icon" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><div class="placeholder-icon" style="display:none;">${getInitials(app.name)}</div>` :
                    `<div class="placeholder-icon">${getInitials(app.name)}</div>`;
                html += `
                    <div class="app-item" data-index="${index}">
                        <div class="app-item-left">
                            ${iconHtml}
                            <span class="name">${app.name}</span>
                        </div>
                        <button class="edit-btn" data-index="${index}">✏️ Edit</button>
                    </div>
                `;
            });
            container.innerHTML = html;

            // Click events
            document.querySelectorAll('.edit-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const idx = parseInt(btn.dataset.index);
                    openEditModal(idx);
                });
            });
        }

        // ========== ADD APP ==========
        document.getElementById('addAppBtn').addEventListener('click', () => {
            const name = document.getElementById('appNameInput').value.trim();
            const iconUrl = document.getElementById('appIconUrlInput').value.trim();
            if (!name) {
                showToast('❌ Please enter app name');
                return;
            }
            apps.push({ name, icon: iconUrl || '' });
            saveApps();
            document.getElementById('appNameInput').value = '';
            document.getElementById('appIconUrlInput').value = '';
            showToast('✅ App added!');
        });

        // Enter key
        document.getElementById('appNameInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') document.getElementById('addAppBtn').click();
        });

        // ========== EDIT MODAL ==========
        function openEditModal(index) {
            editingIndex = index;
            const app = apps[index];
            document.getElementById('editNameInput').value = app.name;
            const preview = document.getElementById('iconPreview');
            if (app.icon) {
                preview.innerHTML = `<img src="${app.icon}" alt="icon" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><div class="placeholder-icon" style="display:none;">${getInitials(app.name)}</div>`;
            } else {
                preview.innerHTML = `<div class="placeholder-icon">${getInitials(app.name)}</div>`;
            }
            document.getElementById('editIconUrlInput').value = app.icon || '';
            document.getElementById('editModal').style.display = 'flex';
        }

        function closeEditModal() {
            document.getElementById('editModal').style.display = 'none';
            editingIndex = -1;
        }

        document.getElementById('cancelEditBtn').addEventListener('click', closeEditModal);

        // Save edit
        document.getElementById('saveEditBtn').addEventListener('click', () => {
            if (editingIndex < 0) return;
            const newName = document.getElementById('editNameInput').value.trim();
            const newIcon = document.getElementById('editIconUrlInput').value.trim();
            if (!newName) {
                showToast('❌ Name cannot be empty');
                return;
            }
            apps[editingIndex].name = newName;
            apps[editingIndex].icon = newIcon;
            saveApps();
            closeEditModal();
            showToast('✅ App updated!');
        });

        // Delete app
        document.getElementById('deleteAppBtn').addEventListener('click', () => {
            if (editingIndex < 0) return;
            if (confirm(`Delete "${apps[editingIndex].name}"?`)) {
                apps.splice(editingIndex, 1);
                saveApps();
                closeEditModal();
                showToast('🗑️ App deleted');
            }
        });

        // File upload for icon
        document.getElementById('fileLabel').addEventListener('click', () => {
            document.getElementById('iconFileInput').click();
        });

        document.getElementById('iconFileInput').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                const dataUrl = ev.target.result;
                document.getElementById('editIconUrlInput').value = dataUrl;
                // Update preview
                const preview = document.getElementById('iconPreview');
                preview.innerHTML = `<img src="${dataUrl}" alt="icon" style="width:80px;height:80px;border-radius:20px;object-fit:cover;border:2px solid #ff4444;">`;
                showToast('✅ Icon loaded!');
            };
            reader.readAsDataURL(file);
        });

        // Close modal on overlay click
        document.getElementById('editModal').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) closeEditModal();
        });

        // ========== INIT ==========
        renderApps();

        // ========== SERVICE WORKER (PWA) ==========
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
</body>
</html>
